name: Replace placeholder style references with real artwork
on:
  push:
    branches: [main]
    paths:
      - 'scripts/install_style_artworks.py'
      - '.github/workflows/install_style_artworks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests
      - name: Replace all six bundled reference images
        run: python scripts/install_style_artworks.py
      - name: Check images exist and are distinguishable
        run: |
          python - <<'PY'
          import hashlib
          from PIL import Image
          from pathlib import Path
          files=sorted(Path('data/styles').glob('*.png'))
          assert len(files)==6,files
          hashes=[]
          for p in files:
              im=Image.open(p)
              im.verify()
              hashes.append(hashlib.sha256(p.read_bytes()).hexdigest())
              assert p.stat().st_size>1024, (p, p.stat().st_size)
              print(f'{p}: {p.stat().st_size} bytes')
          assert len(set(hashes))==6
          PY
      - name: Commit image replacements to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/styles/
          if ! git diff --cached --quiet; then
            git commit -m "Replace procedural style placeholders with real artwork references"
            git push origin HEAD:main
          fi
